<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="I don’t just write code. I build digital experiences where technology, design, interaction, and usability work together." font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#111B34"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset="1" stop-color="#60A5FA" stop-opacity=".55"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#60A5FA" stop-opacity=".35"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#93C5FD"/></linearGradient>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<clipPath id="c"><rect x="1" y="1" width="998" height="278" rx="30"/></clipPath>
<rect x="1" y="1" width="998" height="278" rx="30" fill="url(#bg)"/>
<g clip-path="url(#c)"><circle cx="120" cy="40" r="130" fill="#2563EB" opacity=".35" filter="url(#blur)"><animate attributeName="opacity" values=".25;.45;.25" dur="8s" repeatCount="indefinite"/></circle><circle cx="900" cy="260" r="140" fill="#1D4ED8" opacity=".3" filter="url(#blur)"/></g>
<rect x="1" y="1" width="998" height="278" rx="30" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
<path d="M40 2h920" stroke="#fff" stroke-opacity=".35" stroke-linecap="round"/>
<text x="500" y="108" font-size="52" font-weight="800" text-anchor="middle" fill="url(#t)" filter="url(#glow)">I don’t just write code.</text>
<text x="500" y="170" font-size="27" text-anchor="middle" fill="#CBD5E1">I build digital experiences where technology, design,</text>
<text x="500" y="208" font-size="27" text-anchor="middle" fill="#CBD5E1">interaction, and usability work together.</text>
</svg>